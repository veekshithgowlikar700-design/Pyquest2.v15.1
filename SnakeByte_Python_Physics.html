 Splitting the line at == gives you the name and the version. Sharing this file lets anyone install the same tools.","line = 'flask==3.0.0'\nname, version = line.split('==')\nprint(name)\nprint(version)","flask\n3.0.0"],["venv","A virtual environment keeps each project's packages separate.","Build the venv command by joining ['python', '-m', 'venv', '.venv'] with spaces, and print it.","python -m venv .venv",["Your code needs about 2 lines and uses: print(), .join().","parts = ['python', '-m', 'venv', '.ven ...","parts = ['python', '-m', 'venv', '.venv']\nprint(' '.join(parts))"],[],["join"],"You create one with python -m venv followed by a folder name. Commands are just words, so in code you can build them by joining a list with spaces. Separate environments stop projects from breaking each other.","print(' '.join(['pip', 'install', 'flask']))","pip install flask"],["__name__","__name__ == '__main__' means the file is being run directly.","Write an  if __name__ == '__main__':  block that prints running as script.","running as script",["Your code needs about 2 lines and uses: if, print().","if __name__ == '__main__':\n    pri ...","if __name__ == '__main__':\n    print('running as script')"],[],["__name__"],"Code under that check runs when you run the file, but not when another file imports it. Most programs put their starting function there. It is the standard Python entry point.","def main():\n    print('hello')\n\nif __name__ == '__main__':\n    main()","hello"],["typing","Type hints describe what a function expects and returns.","Write add(a: int, b: int) -> int returning the sum. Print add(2, 3) then the name of the return annotation: add.__annotations__['return'].__name__","5\nint",["Your code needs about 5 lines and uses: def, return, print(), add().","def add(a: int, b: int) -> int:\n    return a + b\n\n# ...you finish it","def add(a: int, b: int) -> int:\n    return a + b\n\nprint(add(2, 3))\nprint(add.__annotations__['return'].__name__)"],[],["->"],"Write name: type for parameters and -> type for the result. Python does not force them, but they make code clearer and help tools find bugs. They are saved in .__annotations__.","def double(n: int) -> int:\n    return n * 2\n\nprint(double(4))\nprint(double.__annotations__['n'].__name__)","8\nint"],["dataclasses","@dataclass fields can have default values.","@dataclass Item with name: str and price: float = 1.0. Print the total price of Item('a', 2.5) and Item('b').","3.5",["Your code needs about 9 lines and uses: import, class, print(), Item(), sum().","from dataclasses import dataclass\n\n@dataclass\nclass Item:\n    name: str\n# ...you finish it","from dataclasses import dataclass\n\n@dataclass\nclass Item:\n    name: str\n    price: float = 1.0\n\nitems = [Item('a', 2.5), Item('b')]\nprint(sum(i.price for i in items))"],[],["dataclass"],"A field with = value is optional when you create the object. Fields without a default must be given. It keeps small data classes short and readable.","from dataclasses import dataclass\n\n@dataclass\nclass P:\n    name: str\n    qty: int = 1\n\nprint(P('pen'))\nprint(P('ink', 3).qty)","P(name='pen', qty=1)\n3"],["logging","logging prints messages with levels like INFO and WARNING.","Use logging with basicConfig(stream=sys.stdout, level=logging.INFO, format='%(levelname)s:%(message)s'). Log info 'started', warning 'careful' and debug 'hidden' (debug must NOT show).","INFO:started\nWARNING:careful",["Your code needs about 5 lines and uses: import, .basicConfig(), .info(), .warning(), .debug().","import logging, sys\nlogging.basicConfig(stream=sys.stdout, level=logging.INFO, format='%(levelname)s:%(message)s')\nlogging.info('started')\n# ...you finish it","import logging, sys\nlogging.basicConfig(stream=sys.stdout, level=logging.INFO, format='%(levelname)s:%(message)s')\nlogging.info('started')\nlogging.warning('careful')\nlogging.debug('hidden')"],[],["logging"],"Levels in order are DEBUG, INFO, WARNING, ERROR. basicConfig(level=...) chooses the lowest level that is shown, and anything below it is hidden. It is better than print() for real programs.","import logging, sys\nlogging.basicConfig(stream=sys.stdout, level=logging.WARNING, format='%(levelname)s:%(message)s')\nlogging.info('quiet')\nlogging.error('loud')","ERROR:loud"],["testing","assert checks that something is true. It fails loudly if not.","Write add(a, b). Use assert to check add(2, 3) == 5, then print tests passed.","tests passed",["Your code needs about 5 lines and uses: def, assert, return, print(), add().","def add(a, b):\n    return a + b\n\n# ...you finish it","def add(a, b):\n    return a + b\n\nassert add(2, 3) == 5\nprint('tests passed')"],[],["assert"],"assert condition does nothing when the condition is True. If it is False, Python stops with an AssertionError. Asserts are the simplest kind of test.","def double(n):\n    return n * 2\n\nassert double(3) == 6\nprint('ok')","ok"],["Tools Boss","Boss review: a tiny test runner using a dictionary of functions.","BOSS: tests = {'add': lambda: 2 + 3 == 5, 'upper': lambda: 'a'.upper() == 'A', 'bad': lambda: 1 + 1 == 3}. Run each (in order) and print  name: PASS  or  name: FAIL.  Then print  passed 2/3  (computed, not typed).","add: PASS\nupper: PASS\nbad: FAIL\npassed 2/3",["Your code needs about 9 lines and uses: for, .items(), if, print(), lambda, test(), an f-string.","tests = {'add': lambda: 2 + 3 == 5, 'upper': lambda: 'a'.upper() == 'A', 'bad': lambda: 1 + 1 == 3}\npassed = 0\nfor name, test in tests.items():\n    if test():\n        print(f'{name}: PASS')\n# ...you finish it","tests = {'add': lambda: 2 + 3 == 5, 'upper': lambda: 'a'.upper() == 'A', 'bad': lambda: 1 + 1 == 3}\npassed = 0\nfor name, test in tests.items():\n    if test():\n        print(f'{name}: PASS')\n        passed += 1\n    else:\n        print(f'{name}: FAIL')\nprint(f'passed {passed}/{len(tests)}')"],[],["for"],"Store small test functions in a dict, loop over .items(), call each one and report PASS or FAIL. Counting how many passed gives you a summary line. This is how real test tools work, in miniature.","checks = {'a': lambda: 1 + 1 == 2, 'b': lambda: 2 * 2 == 5}\nfor name, f in checks.items():\n    print(name, 'PASS' if f() else 'FAIL')","a PASS\nb FAIL"]]],["🌐","Web, APIs & Networking","Talk to the internet.",[["HTTP","A URL is made of parts: scheme, host, path and query.","Parse 'https://example.com/path?x=1' with urllib.parse.urlparse. Print the scheme, then the netloc.","https\nexample.com",["Your code needs about 4 lines and uses: import, urlparse(), print().","from urllib.parse import urlparse\nu = urlparse('https://example.com/path?x=1')\n# ...you finish it","from urllib.parse import urlparse\nu = urlparse('https://example.com/path?x=1')\nprint(u.scheme)\nprint(u.netloc)"],[],["urlparse"],"In http://site.org/a/b?z=1 the scheme is http, the host is site.org, the path is /a/b and the query is z=1. urllib.parse.urlparse splits a URL into these parts for you.","from urllib.parse import urlparse\nu = urlparse('http://site.org/a/b?z=1')\nprint(u.scheme)\nprint(u.path)","http\n/a/b"],["GET","GET asks a server for data. Options go after the ? in the URL.","Use parse_qs from urllib.parse to print the query dict of 'https://api.site.com/users?id=7&sort=asc'.","{'id': ['7'], 'sort': ['asc']}",["Your code needs about 3 lines and uses: import, urlparse(), print(), parse_qs().","from urllib.parse import urlparse, parse_qs\nu = urlparse('https://api.site.com/users?id=7&sort=asc')\n# ...you finish it","from urllib.parse import urlparse, parse_qs\nu = urlparse('https://api.site.com/users?id=7&sort=asc')\nprint(parse_qs(u.query))"],[],["parse_qs"],"The query part looks like a=1&b=2. parse_qs turns it into a dictionary where each value is a list. GET requests should only read data, never change it.","from urllib.parse import parse_qs\nprint(parse_qs('a=1&b=2'))","{'a': ['1'], 'b': ['2']}"],["POST","POST sends data to a server, usually as JSON in the body.","Encode {'name': 'Sam', 'age': 20} as JSON text with json.dumps (a POST body) and print the length of that text.","26",["Your code needs about 3 lines and uses: import, .dumps(), print(), len().","import json\nbody = json.dumps({'name': 'Sam', 'age': 20})\n# ...you finish it","import json\nbody = json.dumps({'name': 'Sam', 'age': 20})\nprint(len(body))"],[],["json.dumps"],"json.dumps turns a dictionary into text that can travel over the internet. The server reads that text and turns it back into data. POST is used for creating things, like a new user.","import json\nbody = json.dumps({'item': 'pen'})\nprint(body)\nprint(len(body))","{\"item\": \"pen\"}\n15"],["JSON API","APIs reply with JSON. json.loads turns it into dicts and lists.","response = '{\"user\": {\"name\": \"Sam\", \"langs\": [\"py\", \"js\"]}}'. Parse it and print the user's second language.","js",["Your code needs about 4 lines and uses: import, .loads(), print().","import json\nresponse = '{\"user\": {\"name\": \"Sam\", \"langs\": [\"py\", \"js\"]}}'\n# ...you finish it","import json\nresponse = '{\"user\": {\"name\": \"Sam\", \"langs\": [\"py\", \"js\"]}}'\ndata = json.loads(response)\nprint(data['user']['langs'][1])"],[],["json.loads"],"After loading, you dig into the data with keys and indexes, like data['list'][2]. Read the structure carefully: curly brackets mean dict, square brackets mean list.","import json\nr = '{\"list\": [5, 6, 7]}'\nprint(json.loads(r)['list'][2])","7"],["requests","Libraries build URLs for you, but you can write the idea yourself.","Write build_url(base, **params) returning base + '?' + the key=value pairs joined by &. Print build_url('https://a.com', q='py', page=2).","https://a.com?q=py&page=2",["Your code needs about 5 lines and uses: def, return, print(), a list comprehension, build_url(), an f-string, .join().","def build_url(base, **params):\n    pairs = [f'{k}={v}' for k, v in params.items()]\n    return base + '?' + '&'.join(pairs)\n# ...you finish it","def build_url(base, **params):\n    pairs = [f'{k}={v}' for k, v in params.items()]\n    return base + '?' + '&'.join(pairs)\n\nprint(build_url('https://a.com', q='py', page=2))"],[],["**params"],"A function can join a base address and a path with a slash. Real libraries like requests do this and much more. Understanding the plain version helps you debug the real one.","def make(base, path):\n    return base + '/' + path\n\nprint(make('https://api.x.com', 'users'))","https://api.x.com/users"],["status","Status codes: 2xx means OK, 4xx your mistake, 5xx the server's mistake.","Write status_kind(code): 'success' for 2xx, 'redirect' for 3xx, 'client error' for 4xx, 'server error' for 5xx. Print it for 200, 301, 404, 500 (one per line).","success\nredirect\nclient error\nserver error",["Your code needs about 11 lines and uses: def, for, if, return, print(), status_kind().","def status_kind(code):\n    if code // 100 == 2:\n        return 'success'\n    if code // 100 == 3:\n        return 'redirect'\n    if code // 100 == 4:\n# ...you finish it","def status_kind(code):\n    if code // 100 == 2:\n        return 'success'\n    if code // 100 == 3:\n        return 'redirect'\n    if code // 100 == 4:\n        return 'client error'\n    return 'server error'\n\nfor c in [200, 301, 404, 500]:\n    print(status_kind(c))"],[],["def"],"200 is success, 301 is a redirect, 404 is not found and 500 is a server error. The first digit tells you the story. Whole-number division by 100 gives that first digit.","def kind(c):\n    return 'ok' if c < 300 else 'error'\n\nprint(kind(200))\nprint(kind(404))","ok\nerror"],["404","A missing page returns 404. dict.get(key, default) handles it neatly.","routes = {'/': 'home', '/about': 'about us'}. Write get_page(path) that returns the page, or '404 Not Found' if missing. Print get_page('/about') then get_page('/x').","about us\n404 Not Found",["Your code needs about 7 lines and uses: def, return, print(), .get(), get_page().","routes = {'/': 'home', '/about': 'about us'}\n\ndef get_page(path):\n    return routes.get(path, '404 Not Found')\n# ...you finish it","routes = {'/': 'home', '/about': 'about us'}\n\ndef get_page(path):\n    return routes.get(path, '404 Not Found')\n\nprint(get_page('/about'))\nprint(get_page('/x'))"],[],["def"],"Store routes in a dictionary from path to page. .get(path, default) returns the default when the path is missing instead of crashing. That is the heart of a tiny web server.","pages = {'/': 'home'}\nprint(pages.get('/', '404'))\nprint(pages.get('/x', '404'))","home\n404"],["API key","Never show a full secret key. Mask most of it.","Write mask(key) that hides all but the last 4 characters with * (same length). Print mask('sk-abc123456789').","***********6789",["Your code needs about 4 lines and uses: def, return, print(), mask(), len().","def mask(key):\n    return '*' * (len(key) - 4) + key[-4:]\n# ...you finish it","def mask(key):\n    return '*' * (len(key) - 4) + key[-4:]\n\nprint(mask('sk-abc123456789'))"],[],["def"],"API keys are like passwords. Slicing lets you keep just the start or end, and the rest can be stars. Multiply a string by a number to repeat it, like '*' * 5.","key = 'abcd1234'\nprint(key[:2] + '***')\nprint(key[-3:])","ab***\n234"],["FastAPI","A decorator can register functions as web routes.","Build a mini router: routes = {} and a decorator route(path) that stores the function in routes[path]. Decorate hello() (returns 'hi') with @route('/hi') and print routes['/hi']().","hi",["Your code needs about 13 lines and uses: def, return, route(), print().","routes = {}\n\ndef route(path):\n    def register(fn):\n        routes[path] = fn\n        return fn\n    return register\n# ...you finish it","routes = {}\n\ndef route(path):\n    def register(fn):\n        routes[path] = fn\n        return fn\n    return register\n\n@route('/hi')\ndef hello():\n    return 'hi'\n\nprint(routes['/hi']())"],[],["def","@route"],"Frameworks like FastAPI use @route('/path') above a function to say which address it answers. Under the hood the decorator just stores the function in a dictionary. Calling routes[path]() then runs it.","routes = {}\n\ndef route(p):\n    def reg(f):\n        routes[p] = f\n        return f\n    return reg\n\n@route('/a')\ndef a():\n    return 'A'\n\nprint(routes['/a']())","A"],["Web Boss","Boss review: a handler decides what to do from the method and path.","BOSS: users = []. handle(method, path, body=None): POST /users appends body to users and returns 'created'; GET /users returns json.dumps(users); anything else returns '404'. Call POST with {'name': 'Ana'}, POST with {'name': 'Bo'}, then print the result of GET /users.","[{\"name\": \"Ana\"}, {\"name\": \"Bo\"}]",["Your code needs about 14 lines and uses: import, def, if, return, handle(), print(), .append().","import json\nusers = []\n\ndef handle(method, path, body=None):\n    if method == 'POST' and path == '/users':\n        users.append(body)\n        return 'created'\n# ...you finish it","import json\nusers = []\n\ndef handle(method, path, body=None):\n    if method == 'POST' and path == '/users':\n        users.append(body)\n        return 'created'\n    if method == 'GET' and path == '/users':\n        return json.dumps(users)\n    return '404'\n\nhandle('POST', '/users', {'name': 'Ana'})\nhandle('POST', '/users', {'name': 'Bo'})\nprint(handle('GET', '/users'))"],[],["def","json"],"A server function receives the method (GET, POST) and the path, then uses if checks to pick the right answer. Anything it does not know returns 404. Check both method and path together with and.","def handle(m, p):\n    if m == 'GET' and p == '/ping':\n        return 'pong'\n    return '404'\n\nprint(handle('GET', '/ping'))\nprint(handle('POST', '/ping'))","pong\n404"]]],["📊","Data & Automation","Use Python for useful work.",[["CSV","CSV is text where values are separated by commas.","text = 'name,age\\nSam,20\\nAna,25'. Print the header as a list (split the first line by commas).","['name', 'age']",["Your code needs about 3 lines and uses: .split(), print().","text = 'name,age\\nSam,20\\nAna,25'\nheader = text.split('\\n')[0].split(',')\n# ...you finish it","text = 'name,age\\nSam,20\\nAna,25'\nheader = text.split('\\n')[0].split(',')\nprint(header)"],[],["split"],"Each line is one row and each comma starts a new column. Splitting a line on ',' gives you a list of its values. Spreadsheets can export to CSV.","line = 'tea,3,hot'\nprint(line.split(','))","['tea', '3', 'hot']"],["NumPy","Data tools often start with simple maths, like the average.","Without NumPy, write mean(values) and print mean([4, 8, 15, 16, 23, 42]).","18.0",["Your code needs about 4 lines and uses: def, return, print(), mean(), sum(), len().","def mean(values):\n    return sum(values) / len(values)\n# ...you finish it","def mean(values):\n    return sum(values) / len(values)\n\nprint(mean([4, 8, 15, 16, 23, 42]))"],[],["def"],"The mean is the sum of the values divided by how many there are. NumPy and pandas do this for huge tables, but the idea is just sum() / len(). Understand it by hand first.","def avg(v):\n    return sum(v) / len(v)\n\nprint(avg([2, 4, 9]))","5.0"],["Pandas","A table can be a list of dictionaries. Filter it with a comprehension.","rows = [{'n': 'A', 's': 50}, {'n': 'B', 's': 70}, {'n': 'C', 's': 90}]. Print the list of names whose s >= 70.","['B', 'C']",["Your code needs about 2 lines and uses: print(), a list comprehension.","rows = [{'n': 'A', 's': 50}, {'n': 'B', 's': 70}, {'n': 'C', 's': 90} ...","rows = [{'n': 'A', 's': 50}, {'n': 'B', 's': 70}, {'n': 'C', 's': 90}]\nprint([r['n'] for r in rows if r['s'] >= 70])"],[],["for"],"Each dictionary is one row, and the keys are the column names. A list comprehension with an if keeps only the rows you want. This is what pandas does with dataframes.","rows = [{'n': 'x', 'a': 5}, {'n': 'y', 'a': 9}]\nprint([r['n'] for r in rows if r['a'] > 6])","['y']"],["Matplotlib","A chart can be made from text. '#' * number draws a bar.","For data = {'A': 3, 'B': 5} print a text bar chart, one line per key, like  A ###  (key, a space, then # repeated value times).","A ###\nB #####",["Your code needs about 3 lines and uses: for, .items(), print().","data = {'A': 3, 'B': 5}\nfor k, v in data.items():\n# ...you finish it","data = {'A': 3, 'B': 5}\nfor k, v in data.items():\n    print(k, '#' * v)"],[],["for"],"Multiplying a string repeats it, so '#' * 4 gives ####. Loop over a dictionary's items to print one bar per key. Real charts use matplotlib, but the data idea is identical.","for n, v in {'a': 2, 'b': 4}.items():\n    print(n, '#' * v)","a ##\nb ####"],["automation","Automation means looping over many items and fixing each one.","files = ['a.TXT', 'b.Txt', 'c.txt']. Print a list with every name converted to lowercase.","['a.txt', 'b.txt', 'c.txt']",["Your code needs about 2 lines and uses: print(), a list comprehension, .lower().","files = ['a.TXT', 'b.Txt', 'c.txt']\nprint ...","files = ['a.TXT', 'b.Txt', 'c.txt']\nprint([f.lower() for f in files])"],[],["lower"],"Computers are great at boring repeated jobs, like cleaning 1000 file names. A loop or comprehension applies the same fix to every name. .lower() is a common clean-up step.","names = ['A.PNG', 'b.Png']\nprint([n.lower() for n in names])","['a.png', 'b.png']"],["regex","Regular expressions find patterns in text.","Use re.findall with r'\\d+' to print all numbers found in 'Order 66 has 3 items for 120 dollars'.","['66', '3', '120']",["Your code needs about 2 lines and uses: import, print(), .findall().","import re\nprint(re.findall(r'\\d+', 'Order 66  ...","import re\nprint(re.findall(r'\\d+', 'Order 66 has 3 items for 120 dollars'))"],[],["re."],"re.findall(pattern, text) returns every match as a list. In a pattern, \\d+ means one or more digits. Put an r before the quotes so backslashes are kept as they are.","import re\nprint(re.findall(r'\\d+', 'a1 b22 c333'))","['1', '22', '333']"],["datetime","Subtracting two dates gives a timedelta. Use .days.","Print the number of days between date(2024, 1, 1) and date(2024, 3, 1).","60",["Your code needs about 2 lines and uses: import, print(), date().","from datetime import date\nprint((date(2024, 3 ...","from datetime import date\nprint((date(2024, 3, 1) - date(2024, 1, 1)).days)"],[],["date"],"date(2025, 1, 10) - date(2025, 1, 1) gives 9 days. This makes countdowns, ages and deadlines easy. The datetime module handles leap years for you.","from datetime import date\nprint((date(2025, 1, 10) - date(2025, 1, 1)).days)","9"],["csv module","csv.DictReader reads CSV text into dictionaries.","data = 'name,score\\nSam,80\\nAna,90'. Use csv.DictReader with io.StringIO(data) and print the average score.","85.0",["Your code needs about 4 lines and uses: import, list(), print(), .DictReader(), .StringIO(), sum(), len().","import csv, io\ndata = 'name,score\\nSam,80\\nAna,90'\n# ...you finish it","import csv, io\ndata = 'name,score\\nSam,80\\nAna,90'\nrows = list(csv.DictReader(io.StringIO(data)))\nprint(sum(int(r['score']) for r in rows) / len(rows))"],[],["csv"],"The first line is used as the column names. Each following line becomes a dictionary. io.StringIO lets you treat a normal string like a file. Values come in as text, so use int() for numbers.","import csv, io\nrows = list(csv.DictReader(io.StringIO('n,v\\na,1\\nb,2')))\nprint(rows[0]['n'])\nprint(sum(int(r['v']) for r in rows))","a\n3"],["automation project","Group items with dict.setdefault(key, []).append(item).","names = ['a.py', 'b.txt', 'c.py', 'd.md']. Group them by extension into a dict of lists and print it (extensions in order of first appearance).","{'py': ['a.py', 'c.py'], 'txt': ['b.txt'], 'md': ['d.md']}",["Your code needs about 6 lines and uses: for, print(), .append(), .split(), .setdefault().","names = ['a.py', 'b.txt', 'c.py', 'd.md']\ngroups = {}\nfor n in names:\n# ...you finish it","names = ['a.py', 'b.txt', 'c.py', 'd.md']\ngroups = {}\nfor n in names:\n    ext = n.split('.')[-1]\n    groups.setdefault(ext, []).append(n)\nprint(groups)"],[],["for"],"setdefault creates an empty list the first time a key appears and gives you that list. Then append adds to it. Afterwards you have each group in one place.","g = {}\nfor w in ['ant', 'bee', 'ape']:\n    g.setdefault(w[0], []).append(w)\nprint(g)","{'a': ['ant', 'ape'], 'b': ['bee']}"],["Data Boss","Boss review: total per group, then sort the results.","BOSS: lines = ['N,100', 'S,250', 'N,50', 'E,75', 'S,25'] (region,amount). Total each region and print  region: total  one per line, highest total first.","S: 275\nN: 150\nE: 75",["Your code needs about 7 lines and uses: for, sorted(), .split(), .items(), print(), .get(), int().","lines = ['N,100', 'S,250', 'N,50', 'E,75', 'S,25']\ntotals = {}\nfor line in lines:\n    region, amount = line.split(',')\n# ...you finish it","lines = ['N,100', 'S,250', 'N,50', 'E,75', 'S,25']\ntotals = {}\nfor line in lines:\n    region, amount = line.split(',')\n    totals[region] = totals.get(region, 0) + int(amount)\nfor region, total in sorted(totals.items(), key=lambda kv: -kv[1]):\n    print(f'{region}: {total}')"],[],["for"],"Add up values in a dictionary with get(key, 0) + value. Then sort .items() with key=lambda kv: -kv[1] to show the biggest first. This is the core of every report.","t = {}\nfor k, v in [('a', 1), ('b', 5), ('a', 9)]:\n    t[k] = t.get(k, 0) + v\nfor k, v in sorted(t.items(), key=lambda kv: -kv[1]):\n    print(k, v)","a 10\nb 5"]]],["🤖","AI & Machine Learning","Use Python for modern AI work.",[["ML","Machine learning finds patterns from examples instead of fixed rules.","Pairs (x, y): data = [(1, 2), (2, 4), (3, 6)]. Compute y / x for each pair and print the average of those ratios.","2.0",["Your code needs about 3 lines and uses: a list comprehension, print(), sum(), len().","data = [(1, 2), (2, 4), (3, 6)]\nratios = [y / x for x, y in data]\n# ...you finish it","data = [(1, 2), (2, 4), (3, 6)]\nratios = [y / x for x, y in data]\nprint(sum(ratios) / len(ratios))"],[],["for"],"You show the computer many example pairs of input and answer. It looks for the pattern that connects them. Here the pattern is simply 'multiply by something'.","data = [(1, 3), (2, 6)]\nratios = [y / x for x, y in data]\nprint(ratios)","[3.0, 3.0]"],["scikit-learn","Libraries give you metrics. Error measures how far off predictions are.","Write mean_absolute_error(true, pred) and print it for [3, 5, 7] vs [2, 5, 9].","1.0",["Your code needs about 4 lines and uses: def, return, print(), mean_absolute_error(), sum(), len(), abs().","def mean_absolute_error(true, pred):\n    return sum(abs(t - p) for t, p in zip(true, pred)) / len(true)\n# ...you finish it","def mean_absolute_error(true, pred):\n    return sum(abs(t - p) for t, p in zip(true, pred)) / len(true)\n\nprint(mean_absolute_error([3, 5, 7], [2, 5, 9]))"],[],["def"],"scikit-learn has functions like mean_absolute_error. It takes the gap between each true value and prediction, ignores the sign, and averages them. Smaller means a better model.","true = [1, 2]\npred = [2, 4]\nerrs = [abs(a - b) for a, b in zip(true, pred)]\nprint(errs)\nprint(sum(errs) / len(errs))","[1, 2]\n1.5"],["features","Features are scaled to 0-1 so no number dominates.","Min-max normalize [10, 20, 30, 40] to the range 0 to 1. Print the list with each value rounded to 2 decimals.","[0.0, 0.33, 0.67, 1.0]",["Your code needs about 3 lines and uses: print(), min(), max(), a list comprehension, round().","vals = [10, 20, 30, 40]\nlo, hi = min(vals), max(vals)\n# ...you finish it","vals = [10, 20, 30, 40]\nlo, hi = min(vals), max(vals)\nprint([round((v - lo) / (hi - lo), 2) for v in vals])"],[],["min","max"],"Min-max scaling uses (value - min) / (max - min). The smallest value becomes 0 and the biggest becomes 1. Models learn better when inputs are on similar scales.","v = [2, 4, 6]\nlo, hi = min(v), max(v)\nprint([(x - lo) / (hi - lo) for x in v])","[0.0, 0.5, 1.0]"],["label","Features (X) are the inputs. The label (y) is the answer to learn.","rows = [[1, 2, 'a'], [3, 4, 'b']]; the last item of each row is the label. Print X (the rows without labels) on line 1 and y (the labels) on line 2.","[[1, 2], [3, 4]]\n['a', 'b']",["Your code needs about 5 lines and uses: a list comprehension, print().","rows = [[1, 2, 'a'], [3, 4, 'b']]\nX = [r[:-1] for r in rows]\ny = [r[-1] for r in rows]\n# ...you finish it","rows = [[1, 2, 'a'], [3, 4, 'b']]\nX = [r[:-1] for r in rows]\ny = [r[-1] for r in rows]\nprint(X)\nprint(y)"],[],["for"],"A dataset row holds feature values and the correct answer. Split them into two lists: X for what the model sees and y for what it should predict. Slicing r[:-1] and r[-1] is a quick way to do it.","rows = [[5, 'yes'], [7, 'no']]\nX = [r[0] for r in rows]\ny = [r[1] for r in rows]\nprint(X)\nprint(y)","[5, 7]\n['yes', 'no']"],["train","Training means finding the number (weight) that fits the data best.","Fit y = w * x to the points (1, 2), (2, 4), (3, 6) using w = sum(x*y) / sum(x*x). Print w.","2.0",["Your code needs about 3 lines and uses: print(), sum().","pts = [(1, 2), (2, 4), (3, 6)]\nw = sum(x * y for x, y in pts) / sum(x * x for x, y in pts)\n# ...you finish it","pts = [(1, 2), (2, 4), (3, 6)]\nw = sum(x * y for x, y in pts) / sum(x * x for x, y in pts)\nprint(w)"],[],["sum"],"For a line y = w * x, a good weight is sum(x*y) / sum(x*x). This is a tiny version of what real models do with millions of weights. The result is the model.","pts = [(1, 3), (2, 6)]\nw = sum(x * y for x, y in pts) / sum(x * x for x, y in pts)\nprint(w)","3.0"],["predict","Predicting means using the trained weight on new inputs.","With w = 2.5, write predict(x) = w * x. Print the list of predictions for [1, 2, 3].","[2.5, 5.0, 7.5]",["Your code needs about 6 lines and uses: def, return, print(), a list comprehension, predict().","w = 2.5\n\ndef predict(x):\n# ...you finish it","w = 2.5\n\ndef predict(x):\n    return w * x\n\nprint([predict(x) for x in [1, 2, 3]])"],[],["def"],"Once you have w, a prediction for any x is just w * x. A list comprehension can predict many inputs at once. This is the useful part of machine learning.","w = 3\nprint([w * x for x in [4, 5]])","[12, 15]"],["overfitting","Overfitting: a model that memorises fails on new data. Keep a test set.","A memorizer model: train = {1: 2, 2: 4, 3: 6}; model(x) returns train.get(x, 'unknown'). Print model(2) then model(10).","4\nunknown",["Your code needs about 7 lines and uses: def, return, print(), .get(), model().","train = {1: 2, 2: 4, 3: 6}\n\ndef model(x):\n    return train.get(x, 'unknown')\n# ...you finish it","train = {1: 2, 2: 4, 3: 6}\n\ndef model(x):\n    return train.get(x, 'unknown')\n\nprint(model(2))\nprint(model(10))"],[],["def"],"Split your data into a training part and a test part. Train only on the first, then check on the second to see if it truly learned. Slicing a list does the split.","data = list(range(10))\ntrain = data[:7]\ntest = data[7:]\nprint(len(train), len(test))","7 3"],["AI API","An AI API takes a JSON request and sends back a JSON answer.","Build a chat request: payload = {'model': 'tiny', 'messages': [{'role': 'user', 'content': 'Hi'}]}. Print it as JSON text with json.dumps.","{\"model\": \"tiny\", \"messages\": [{\"role\": \"user\", \"content\": \"Hi\"}]}",["Your code needs about 3 lines and uses: import, print(), .dumps().","import json\npayload = {'model': 'tiny', 'messages': [{'role': 'user', 'content': 'Hi'}]}\n# ...you finish it","import json\npayload = {'model': 'tiny', 'messages': [{'role': 'user', 'content': 'Hi'}]}\nprint(json.dumps(payload))"],[],["json"],"You build a dictionary describing what you want, then turn it into text with json.dumps. The service sends JSON back and you load it with json.loads. Chatbots work this way.","import json\nreq = {'prompt': 'hello', 'max': 5}\nprint(json.dumps(req))","{\"prompt\": \"hello\", \"max\": 5}"],["ethics","Always check AI answers. A simple verifier catches surprises.","Write verify(answer, allowed) returning 'ok' if the answer is in allowed, else 'needs review'. Print verify('cat', ['cat', 'dog']) then verify('cow', ['cat', 'dog']).","ok\nneeds review",["Your code needs about 5 lines and uses: def, return, print(), verify().","def verify(answer, allowed):\n    return 'ok' if answer in allowed else 'needs review'\n\n# ...you finish it","def verify(answer, allowed):\n    return 'ok' if answer in allowed else 'needs review'\n\nprint(verify('cat', ['cat', 'dog']))\nprint(verify('cow', ['cat', 'dog']))"],[],["def"],"AI can be wrong or unsafe. A tiny function can compare an answer against what is allowed and flag the rest for a human to review. Checking is part of building responsibly.","def check(a):\n    return 'ok' if a in ['yes', 'no'] else 'review'\n\nprint(check('yes'))\nprint(check('maybe'))","ok\nreview"],["AI Boss","Boss review: nearest neighbour picks the closest known example.","BOSS: 1-nearest-neighbor. train = [((1, 1), 'A'), ((5, 5), 'B'), ((1, 2), 'A'), ((6, 5), 'B')]. Predict the label of the point (2, 2) and then (5, 6): choose the training point with the smallest squared distance. Print both labels on separate lines.","A\nB",["Your code needs about 8 lines and uses: def, return, print(), min(), predict(), lambda.","train = [((1, 1), 'A'), ((5, 5), 'B'), ((1, 2), 'A'), ((6, 5), 'B')]\n\ndef predict(p):\n    best = min(train, key=lambda t: (t[0][0] - p[0]) ** 2 + (t[0][1] - p[1]) ** 2)\n# ...you finish it","train = [((1, 1), 'A'), ((5, 5), 'B'), ((1, 2), 'A'), ((6, 5), 'B')]\n\ndef predict(p):\n    best = min(train, key=lambda t: (t[0][0] - p[0]) ** 2 + (t[0][1] - p[1]) ** 2)\n    return best[1]\n\nprint(predict((2, 2)))\nprint(predict((5, 6)))"],[],["def"],"To label a new point, find the training point with the smallest distance and copy its label. min() with a key function does the searching. This simple idea powers many real systems.","pts = [(0, 'A'), (10, 'B')]\nq = 3\nprint(min(pts, key=lambda p: abs(p[0] - q))[1])","A"]]],["🚀","Advanced Python","Become a serious Python programmer.",[["iterator","An iterator hands out items one at a time with next().","it = iter([10, 20, 30]). Print next(it) twice, then print list(it) (what is left).","10\n20\n[30]",["Your code needs about 4 lines and uses: iter(), print(), next(), list().","it = iter([10, 20, 30])\nprint(next(it))\n# ...you finish it","it = iter([10, 20, 30])\nprint(next(it))\nprint(next(it))\nprint(list(it))"],[],["next("],"iter(list) makes an iterator and next(it) gives the following item. A for loop does exactly this behind the scenes. When items run out, next() raises StopIteration.","it = iter(['a', 'b'])\nprint(next(it))\nprint(next(it))","a\nb"],["generator","A generator uses yield to hand out values one by one, lazily.","Write a generator countdown(n) that yields n, n-1, ... 1. Print list(countdown(4)).","[4, 3, 2, 1]",["Your code needs about 6 lines and uses: def, while, print(), list(), yield, countdown().","def countdown(n):\n    while n > 0:\n        yield n\n# ...you finish it","def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\nprint(list(countdown(4)))"],[],["yield"],"Instead of building a whole list in memory, a generator pauses at each yield and continues when asked for the next value. Wrap it in list() to collect everything.","def up(n):\n    for i in range(1, n + 1):\n        yield i\n\nprint(list(up(3)))","[1, 2, 3]"],["decorator","A decorator wraps a function to add extra behaviour.","Write a decorator shout that makes a function's returned string uppercase. Decorate greet() (returns 'hi') and print greet().","HI",["Your code needs about 10 lines and uses: def, return, print(), greet(), .upper(), fn().","def shout(fn):\n    def wrapper():\n        return fn().upper()\n    return wrapper\n\n# ...you finish it","def shout(fn):\n    def wrapper():\n        return fn().upper()\n    return wrapper\n\n@shout\ndef greet():\n    return 'hi'\n\nprint(greet())"],[],["@shout"],"A decorator is a function that takes a function and returns a new one. The @name line above a function applies it. It is perfect for logging, timing and checks.","def loud(f):\n    def w():\n        print('start')\n        return f()\n    return w\n\n@loud\ndef hi():\n    print('hi')\n\nhi()","start\nhi"],["context manager","A context manager runs setup and cleanup around a with block.","Use @contextmanager (contextlib) to make ctx(): print enter before and exit after. Use  with ctx():  and print inside in the middle.","enter\ninside\nexit",["Your code needs about 10 lines and uses: import, def, with, print(), yield, ctx().","from contextlib import contextmanager\n\n@contextmanager\ndef ctx():\n    print('enter')\n# ...you finish it","from contextlib import contextmanager\n\n@contextmanager\ndef ctx():\n    print('enter')\n    yield\n    print('exit')\n\nwith ctx():\n    print('inside')"],[],["contextmanager","with"],"With @contextmanager, the code before yield is the setup and the code after is the cleanup. The with body runs in the middle at the yield. Files use this idea to close themselves.","from contextlib import contextmanager\n\n@contextmanager\ndef box():\n    print('open')\n    yield\n    print('close')\n\nwith box():\n    print('work')","open\nwork\nclose"],["async","async def and await let a program wait without blocking.","Write async def add(a, b) returning a + b. In this app you can await at the top level. Print the awaited add(2, 3).","5",["Your code needs about 4 lines and uses: async def, return, print(), await, add().","async def add(a, b):\n    return a + b\n# ...you finish it","async def add(a, b):\n    return a + b\n\nprint(await add(2, 3))"],[],["async","await"],"An async function returns a coroutine. await pauses until it finishes, while other work can continue. In this app you may use await at the top level of your code.","async def two():\n    return 2\n\nprint(await two() + 1)","3"],["await","asyncio.gather runs several async jobs at once.","Write async def fetch(n): await asyncio.sleep(0), then return n * 2. Use await asyncio.gather(fetch(1), fetch(2), fetch(3)) and print the resulting list.","[2, 4, 6]",["Your code needs about 7 lines and uses: import, async def, return, print(), await, .sleep(), .gather().","import asyncio\n\nasync def fetch(n):\n    await asyncio.sleep(0)\n# ...you finish it","import asyncio\n\nasync def fetch(n):\n    await asyncio.sleep(0)\n    return n * 2\n\nprint(await asyncio.gather(fetch(1), fetch(2), fetch(3)))"],[],["gather"],"Pass it several coroutines and await the result. You get a list of answers in the same order you asked. asyncio.sleep(0) is a polite 'let others run' pause.","import asyncio\n\nasync def f(n):\n    await asyncio.sleep(0)\n    return n + 1\n\nprint(await asyncio.gather(f(1), f(2)))","[2, 3]"],["threading","A Lock stops two threads from changing the same data at once.","Use a threading.Lock. Do  with lock:  counter += 1  five times (a loop is fine) and print counter.","5",["Your code needs about 7 lines and uses: import, for, .Lock(), range(), with, print().","import threading\nlock = threading.Lock()\ncounter = 0\nfor _ in range(5):\n# ...you finish it","import threading\nlock = threading.Lock()\ncounter = 0\nfor _ in range(5):\n    with lock:\n        counter += 1\nprint(counter)"],[],["Lock","with"],"Wrap the risky change in with lock:. Only one piece of code can hold the lock at a time, the rest wait. It prevents mixed-up results in programs with threads.","import threading\nlock = threading.Lock()\ntotal = 0\nfor i in range(3):\n    with lock:\n        total += i\nprint(total)","3"],["multiprocessing","To use many CPU cores, split the work into chunks and combine the results.","Simulate multiprocessing: split list(range(1, 9)) into 2 chunks of 4, sum each chunk, print the list of chunk sums, then the total of all.","[10, 26]\n36",["Your code needs about 5 lines and uses: list(), a list comprehension, print(), range(), sum().","nums = list(range(1, 9))\nchunks = [nums[0:4], nums[4:8]]\nsums = [sum(c) for c in chunks]\n# ...you finish it","nums = list(range(1, 9))\nchunks = [nums[0:4], nums[4:8]]\nsums = [sum(c) for c in chunks]\nprint(sums)\nprint(sum(sums))"],[],["sum"],"Each chunk can be handled by a separate process, then the partial answers are added together. Here we only simulate the splitting step in plain Python. Slicing a list makes the chunks.","nums = list(range(6))\nparts = [nums[:3], nums[3:]]\nprint([sum(p) for p in parts])","[3, 12]"],["profiling","Measure before you optimise. Counting calls is the simplest profile.","Profile by counting: write a decorator counted that counts calls (store in a dict or list). Apply it to a recursive fib(n) (fib(0)=0, fib(1)=1). Print fib(10), then the number of calls made.","55\n177",["Your code needs about 16 lines and uses: def, return, if, print(), fib(), fn().","calls = {'n': 0}\n\ndef counted(fn):\n    def wrapper(n):\n        calls['n'] += 1\n        return fn(n)\n    return wrapper\n\n# ...you finish it","calls = {'n': 0}\n\ndef counted(fn):\n    def wrapper(n):\n        calls['n'] += 1\n        return fn(n)\n    return wrapper\n\n@counted\ndef fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nprint(fib(10))\nprint(calls['n'])"],[],["@counted"],"Add a counter that goes up every time a function runs. After the program finishes, the counter shows how often it was called. Slow code is often code called far too many times.","n = {'c': 0}\n\ndef f():\n    n['c'] += 1\n\nfor _ in range(4):\n    f()\nprint(n['c'])","4"],["Advanced Boss","Boss review: memoization remembers results so work is not repeated.","BOSS: Write a memoize decorator with a dict cache. Apply it to fib. Print fib(50), then the number of items in the cache.","12586269025\n51",["Your code needs about 17 lines and uses: def, return, if, print(), fib(), len(), fn().","cache = {}\n\ndef memoize(fn):\n    def wrapper(n):\n        if n not in cache:\n            cache[n] = fn(n)\n        return cache[n]\n    return wrapper\n\n# ...you finish it","cache = {}\n\ndef memoize(fn):\n    def wrapper(n):\n        if n not in cache:\n            cache[n] = fn(n)\n        return cache[n]\n    return wrapper\n\n@memoize\ndef fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nprint(fib(50))\nprint(len(cache))"],[],["@memoize"],"Store each answer in a dictionary keyed by the input. If the input is seen again, return the stored answer instead of recomputing. It turns slow recursive code into fast code.","cache = {}\n\ndef sq(n):\n    if n not in cache:\n        cache[n] = n * n\n    return cache[n]\n\nsq(3)\nsq(3)\nprint(len(cache))","1"]]],["👑","CAPSTONE — Python Hero","Build real projects and beat the final boss.",[["Project 1","Project time: a function with if/elif is a calculator.","PROJECT 1 - Calculator: write calc(a, op, b) for + - * /. Division by zero returns 'error'. Print calc(8, '+', 2), calc(8, '/', 2), calc(8, '*', 2), calc(1, '/', 0) one per line.","10\n4.0\n16\nerror",["Your code needs about 16 lines and uses: def, if, print(), return, calc().","def calc(a, op, b):\n    if op == '+':\n        return a + b\n    if op == '-':\n        return a - b\n    if op == '*':\n        return a * b\n    if op == '/':\n# ...you finish it","def calc(a, op, b):\n    if op == '+':\n        return a + b\n    if op == '-':\n        return a - b\n    if op == '*':\n        return a * b\n    if op == '/':\n        if b == 0:\n            return 'error'\n        return a / b\n\nprint(calc(8, '+', 2))\nprint(calc(8, '/', 2))\nprint(calc(8, '*', 2))\nprint(calc(1, '/', 0))"],[],["def"],"Take two numbers and an operator, then use if checks to choose what to do. Return a message for operators you do not know. Small functions like this are the bricks of big apps.","def op(a, o, b):\n    if o == '+':\n        return a + b\n    if o == '-':\n        return a - b\n    return 'unknown'\n\nprint(op(5, '+', 2))\nprint(op(5, '-', 2))","7\n3"],["Project 2","A guessing game loops over guesses and stops when one is right.","PROJECT 2 - Guessing game: secret = 37, guesses = [50, 25, 37]. For each guess print too high / too low / correct! and stop at the correct one. Last print  Attempts: N .","too high\ntoo low\ncorrect!\nAttempts: 3",["Your code needs about 13 lines and uses: for, if, print(), an f-string, break.","secret = 37\nguesses = [50, 25, 37]\nattempts = 0\nfor g in guesses:\n    attempts += 1\n    if g > secret:\n        print('too high')\n# ...you finish it","secret = 37\nguesses = [50, 25, 37]\nattempts = 0\nfor g in guesses:\n    attempts += 1\n    if g > secret:\n        print('too high')\n    elif g < secret:\n        print('too low')\n    else:\n        print('correct!')\n        break\nprint(f'Attempts: {attempts}')"],[],["for"],"Compare each guess with the secret inside a loop. When it matches, print the win message and break. Otherwise print a hint and keep going.","secret = 5\nfor g in [9, 2, 5]:\n    if g == secret:\n        print('yes')\n        break\n    print('no')","no\nno\nyes"],["Project 3","A to-do list is a list plus small functions.","PROJECT 3 - To-do list: tasks = []. Write add(t), done(t) (removes it) and show() (prints  1. task  numbered lines). Do add a, add b, add c, done b, then show().","1. a\n2. c",["Your code needs about 17 lines and uses: def, for, add(), done(), show(), .append(), .remove().","tasks = []\n\ndef add(t):\n    tasks.append(t)\n\ndef done(t):\n    tasks.remove(t)\n\ndef show():\n# ...you finish it","tasks = []\n\ndef add(t):\n    tasks.append(t)\n\ndef done(t):\n    tasks.remove(t)\n\ndef show():\n    for i, t in enumerate(tasks, 1):\n        print(f'{i}. {t}')\n\nadd('a')\nadd('b')\nadd('c')\ndone('b')\nshow()"],[],["def"],"Keep the tasks in a list, add with append and remove with remove. enumerate(list, 1) numbers the items starting from 1 when you print them.","items = []\n\ndef add(x):\n    items.append(x)\n\nadd('milk')\nadd('eggs')\nfor i, x in enumerate(items, 1):\n    print(i, x)","1 milk\n2 eggs"],["Project 4","A quiz compares answers with the answer key and counts the score.","PROJECT 4 - Quiz: questions = [('2+2','4'), ('3*3','9'), ('10-7','3')], answers = ['4','8','3']. Print Q1: correct / Q2: wrong ... for each question, then  Score: 2/3  (computed).","Q1: correct\nQ2: wrong\nQ3: correct\nScore: 2/3",["Your code needs about 10 lines and uses: for, enumerate(), if, print(), an f-string, len().","questions = [('2+2', '4'), ('3*3', '9'), ('10-7', '3')]\nanswers = ['4', '8', '3']\nscore = 0\nfor i, (q, right) in enumerate(questions):\n    if answers[i] == right:\n# ...you finish it","questions = [('2+2', '4'), ('3*3', '9'), ('10-7', '3')]\nanswers = ['4', '8', '3']\nscore = 0\nfor i, (q, right) in enumerate(questions):\n    if answers[i] == right:\n        print(f'Q{i + 1}: correct')\n        score += 1\n    else:\n        print(f'Q{i + 1}: wrong')\nprint(f'Score: {score}/{len(questions)}')"],[],["for"],"zip() pairs up two lists item by item. Count the pairs that match to get the score. Formatting the final line with an f-string makes it look neat.","key = ['a', 'b']\nans = ['a', 'c']\nscore = sum(1 for k, a in zip(key, ans) if k == a)\nprint(score)","1"],["Project 5","A file organizer groups names by their extension.","PROJECT 5 - File organizer: files = ['a.jpg','b.pdf','c.jpg','d.txt','e.pdf']; folders = {'jpg': 'Images', 'pdf': 'Docs'} (other extensions go to 'Other'). Print  Folder: count  per folder, sorted by folder name.","Docs: 2\nImages: 2\nOther: 1",["Your code needs about 8 lines and uses: for, sorted(), .get(), print(), an f-string, .split().","files = ['a.jpg', 'b.pdf', 'c.jpg', 'd.txt', 'e.pdf']\nfolders = {'jpg': 'Images', 'pdf': 'Docs'}\ncounts = {}\nfor f in files:\n# ...you finish it","files = ['a.jpg', 'b.pdf', 'c.jpg', 'd.txt', 'e.pdf']\nfolders = {'jpg': 'Images', 'pdf': 'Docs'}\ncounts = {}\nfor f in files:\n    folder = folders.get(f.split('.')[-1], 'Other')\n    counts[folder] = counts.get(folder, 0) + 1\nfor folder in sorted(counts):\n    print(f'{folder}: {counts[folder]}')"],[],["for"],"split('.')[-1] gets the part after the last dot. A dictionary with get(key, 0) + 1 counts how many files of each type exist. The same idea sorts real files into folders.","counts = {}\nfor f in ['a.py', 'b.py', 'c.md']:\n    e = f.split('.')[-1]\n    counts[e] = counts.get(e, 0) + 1\nprint(counts)","{'py': 2, 'md': 1}"],["Project 6","A notes app saves and loads its data with JSON.","PROJECT 6 - Notes app: notes = [] of dicts. Add {'title': 'Buy milk'} and {'title': 'Study Python'}, save to notes.json with json, load it back, and print the titles joined by ', '.","Buy milk, Study Python",["Your code needs about 9 lines and uses: import, with, .append(), print(), open(), .dump(), .load().","import json\nnotes = []\nnotes.append({'title': 'Buy milk'})\nnotes.append({'title': 'Study Python'})\nwith open('notes.json', 'w') as f:\n# ...you finish it","import json\nnotes = []\nnotes.append({'title': 'Buy milk'})\nnotes.append({'title': 'Study Python'})\nwith open('notes.json', 'w') as f:\n    json.dump(notes, f)\nwith open('notes.json') as f:\n    loaded = json.load(f)\nprint(', '.join(n['title'] for n in loaded))"],[],["json"],"Keep notes as a list of dictionaries. json.dump writes the list to a file and json.load brings it back later. That is all a simple app needs to remember things.","import json\nwith open('n.json', 'w') as f:\n    json.dump(['x'], f)\nwith open('n.json') as f:\n    print(json.load(f))","['x']"],["Project 7","An API client parses JSON and picks out what it needs.","PROJECT 7 - API client: resp = '{\"items\": [{\"id\": 1, \"price\": 9.5}, {\"id\": 2, \"price\": 20}, {\"id\": 3, \"price\": 4.5}]}'. Parse it and print  Most expensive: <id>  then  Total: <sum with 2 decimals> .","Most expensive: 2\nTotal: 34.00",["Your code needs about 7 lines and uses: import, max(), sum(), print(), .loads(), an f-string, lambda.","import json\nresp = '{\"items\": [{\"id\": // Render Python examples consistently with double-quoted strings.
function pyDQ(s){
  s=String(s); let out="", quote=null, triple=false, escp=false;
  for(let i=0;i<s.length;i++){
    const ch=s[i], nx=s[i+1], nx2=s[i+2];
    if(!quote){
      if((ch==="\""||ch==="'") && !(ch==="'" && /[A-Za-z0-9_]/.test(s[i-1]||""))){
        quote=ch; triple=(ch===nx&&ch===nx2);
        if(triple){out+='"""';i+=2}else out+='"';
      }else out+=ch;
    }else{
      if(triple && ch===quote&&nx===quote&&nx2===quote){out+='"""';i+=2;quote=null;triple=false;continue}
      if(!triple && ch===quote && !escp){out+='"';quote=null;continue}
      if(ch==='\\' && !escp){out+=ch;escp=true;continue}
      if(ch==='"' && quote==="'" && !escp)out+='\\"'; else out+=ch;
      escp=false;
    }
  }
  return out;
}
function pyCode(s){return pyDQ(s)}

    },step);
  });

function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}

/* ---------- Python engine (worker with timeout; main-thread fallback) ---------- */
const WORKER_SRC="let py=null;onmessage=async e=>{const m=e.data;if(m.t==='init'){try{importScripts('"+CDN+"pyodide.js');py=await loadPyodide({indexURL:'"+CDN+"'});postMessage({t:'ready'})}catch(x){postMessage({t:'initerr',e:String(x)})}}else if(m.t==='run'){try{py.globals.set('__src',m.code);py.globals.set('__stdin',m.stdin);const r=await py.runPythonAsync("+JSON.stringify(RUNNER)+");postMessage({t:'result',id:m.id,r:r})}catch(x){postMessage({t:'result',id:m.id,r:JSON.stringify({o:'',e:String(x).split('\\n').slice(-2).join(' ')})})}}};";
const engine=(function(){
 let worker=null,ready=null,mode='',pend={},rid=0,main=null,mainP=null;
 function startWorker(){ready=new Promise((res,rej)=>{try{
  const u=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'}));worker=new Worker(u);
  worker.onmessage=e=>{const m=e.data;if(m.t==='ready')res();else if(m.t==='initerr'){const er=new Error(m.e);er.net=true;rej(er)}else if(m.t==='result'&&pend[m.id]){pend[m.id](m.r);delete pend[m.id]}};
  worker.onerror=()=>{const er=new Error('worker');er.fatal=true;rej(er)};
  worker.postMessage({t:'init'})}catch(x){x.fatal=true;rej(x)}});ready.catch(()=>{})}
 function loadMain(){if(main)return Promise.resolve(main);if(!mainP){mainP=(async()=>{await new Promise((res,rej)=>{const s=document.createElement('script');s.src=CDN+'pyodide.js';s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)});main=await loadPyodide({indexURL:CDN});return main})();mainP.catch(()=>{mainP=null})}return mainP}
 function warm(){if(mode==='main')return;if(!worker)startWorker()}
 async function run(code,stdin){const sj=JSON.stringify(stdin||[]);
  if(mode!=='main'){if(!worker)startWorker();
   try{await ready;mode='worker'}catch(e){try{worker&&worker.terminate()}catch(_){}worker=null;ready=null;if(e&&e.fatal){mode='main'}else{return{noEngine:true}}}}
  if(mode==='worker'){const id=++rid;const p=new Promise(res=>{pend[id]=res});worker.postMessage({t:'run',id,code,stdin:sj});
   const r=await Promise.race([p,new Promise(res=>setTimeout(()=>res('__timeout'),6000))]);
   if(r==='__timeout'){delete pend[id];try{worker.terminate()}catch(_){}worker=null;ready=null;setTimeout(warm,50);return{timeout:true}}
   try{return JSON.parse(r)}catch(e){return{o:'',e:'Python error'}}}
  try{const py=await loadMain();py.globals.set('__src',code);py.globals.set('__stdin',sj);return JSON.parse(await py.runPythonAsync(RUNNER))}
  catch(e){if(!main)return{noEngine:true};return{o:'',e:String(e).split('\n').slice(-2).join(' ')}}}
 return{warm,run}})();

var PTOTAL=U.reduce(function(n,u){return n+u.lessons.length},0);

function fresh(){return{xp:0,done:{},ans:0,ok:0,day:{d:"",xp:0}}}
var PS=(function(){try{var j=JSON.parse(localStorage.getItem(PKEY));if(j&&j.done)return j}catch(e){}return fresh()})();
function psave(){try{localStorage.setItem(PKEY,JSON.stringify(PS))}catch(e){}}
var mode=(function(){try{return localStorage.getItem(MKEY)==="physics"?"physics":"python"}catch(e){return"python"}})();
var run=null,rst=false;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function todayXp(){return PS.day.d===dayStr(0)?PS.day.xp:0}
function nodesOf(u){return u.lessons.map(function(l){return{id:l.id,t:l.t,q:l.q,p:l.p,f:l.f,unit:u,quiz:false}}).concat([{id:u.id+"q",t:"Unit check",unit:u,quiz:true}])}
function pUnlocked(ui,ni){var u=U[ui];if(ni===3)return u.lessons.every(function(l){return PS.done[l.id]});if(ni>0)return!!PS.done[u.lessons[ni-1].id];if(ui===0)return true;return U[ui-1].lessons.every(function(l){return PS.done[l.id]})}
function pDone(){return U.reduce(function(n,u){return n+u.lessons.filter(function(l){return PS.done[l.id]}).length},0)}

/* ---------- mode switching ---------- */
function applyMode(){
  var phys=mode==="physics";
  document.documentElement.classList.toggle("phys",phys);
  var sw=$("modeSw");
  if(sw){sw.classList.toggle("p",phys);[].forEach.call(sw.querySelectorAll("button"),function(b){b.classList.toggle("sel",b.getAttribute("data-m")===mode);b.setAttribute("aria-pressed",b.getAttribute("data-m")===mode?"true":"false")})}
  var tb=document.querySelector('#tabbar button[data-t="badges"]');
  if(tb){
    if(!tb.getAttribute("data-orig"))tb.setAttribute("data-orig",tb.innerHTML);
    tb.innerHTML=phys?'<svg viewBox="0 0 24 24"><path d="M18 5H6l6 7-6 7h12"/></svg>Formulas':tb.getAttribute("data-orig");
  }
}
function bar(v){var sw=$("modeSw");if(sw)sw.classList.toggle("on",v==="learn"||v==="badges"||v==="me")}
function setMode(m){
  if(m===mode)return;
  mode=m;try{localStorage.setItem(MKEY,m)}catch(e){}
  applyMode();
  var f=({learn:window.home,badges:window.badgesView,me:window.meView})[view]||window.home;
  f();
  if(m==='python'&&window.maybeShowDayAnimation)try{window.maybeShowDayAnimation()}catch(e){}
}

/* ---------- lesson engine ---------- */
function openLesson(ui,ni){
  if(!pUnlocked(ui,ni)){toast(ni===3?"Finish the three lessons to unlock the unit check":"Complete the earlier lesson first");return}
  var u=U[ui],node=nodesOf(u)[ni],qs;
  if(node.quiz)qs=shuffle([].concat.apply([],u.lessons.map(function(l){return l.q}))).slice(0,8);else qs=shuffle(node.q);
  run={node:node,ui:ui,ni:ni,y:window.pageYOffset||0,queue:qs.map(function(q){return{q:q,tries:0}}),total:qs.length,done:0,lives:node.quiz?4:3,first:0,mist:0,phase:node.quiz?"q":"teach",v:null,leave:false,res:null};
  if(run.phase==="q")prep();
  $("phLesson").hidden=false;draw();
}
function prep(){var q=run.queue[0].q;run.cur=run.queue[0];run.v={sel:null,txt:"",checked:false,ok:false,order:q.k==="m"?shuffle(q.o.map(function(_,i){return i})):null}}
function closeLesson(){
  var y=run?run.y:0;run=null;$("phLesson").hidden=true;
  pHome();window.scrollTo(0,y);
}
function answerText(q){return q.k==="m"?q.o[q.a]:q.k==="t"?(q.a?"True":"False"):(q.a+(q.u?" "+q.u:""))}
function evaluate(q,v){
  if(q.k==="m")return v.sel===q.a;
  if(q.k==="t")return v.sel===(q.a?1:0);
  var x=parseFloat(String(v.txt).replace(",",".").trim());
  if(isNaN(x))return false;
  return Math.abs(x-q.a)<=Math.abs(q.a)*q.tol+1e-9;
}
function draw(){
  var body=$("phBody"),foot=$("phFoot");
  $("phFill").style.width=(run.total?run.done/run.total*100:0)+"%";
  $("phHearts").textContent="❤️ "+run.lives;
  foot.className="";
  if(run.res){drawResult(body,foot);return}
  var h="",f="";
  if(run.phase==="teach"){
    var n=run.node;
    h='<div class="ph-in ph-teach"><div class="ph-eye">Unit '+(run.ui+1)+' · Lesson '+(run.ni+1)+'</div><h2>'+esc(n.t)+'</h2><ul>'+n.p.map(function(p){return"<li>"+esc(p)+"</li>"}).join("")+'</ul><div class="ph-fbox"><div class="ph-eye">Key formulas</div>'+n.f.map(function(x){return"<code>"+esc(x)+"</code>"}).join("")+'</div></div>';
    f='<div class="ph-fin"><button class="ph-btn" data-ph="begin">Start</button></div>';
  }else{
    var it=run.cur,q=it.q,v=run.v;
    var lab=q.k==="m"?"Choose the answer":q.k==="t"?"True or false?":"Type your answer";
    h='<div class="ph-in"><div class="ph-eye">'+lab+'</div><p class="ph-q">'+esc(q.q)+'</p>';
    if(q.k==="m"){
      h+='<div class="ph-opts">'+v.order.map(function(oi,pos){
        var c="ph-opt";if(v.checked){if(oi===q.a)c+=" ok";else if(oi===v.sel)c+=" no"}else if(oi===v.sel)c+=" sel";
        return'<button class="'+c+'" data-ph="pick" data-i="'+oi+'"'+(v.checked?" disabled":"")+'><kbd>'+(pos+1)+'</kbd><span>'+esc(q.o[oi])+'</span></button>'}).join("")+'</div>';
    }else if(q.k==="t"){
      h+='<div class="ph-opts">'+[[1,"True"],[0,"False"]].map(function(o,pos){
        var correct=(q.a?1:0)===o[0],c="ph-opt";if(v.checked){if(correct)c+=" ok";else if(o[0]===v.sel)c+=" no"}else if(o[0]===v.sel)c+=" sel";
        return'<button class="'+c+'" data-ph="pick" data-i="'+o[0]+'"'+(v.checked?" disabled":"")+'><kbd>'+(pos+1)+'</kbd><span>'+o[1]+'</span></button>'}).join("")+'</div>';
    }else{
      h+='<div class="ph-numrow"><input id="phNum" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" value="'+esc(v.txt)+'"'+(v.checked?' disabled class="'+(v.ok?"ok":"no")+'"':"")+'>'+(q.u?'<span class="u">'+esc(q.u)+'</span>':"")+'</div>';
    }
    h+='</div>';
    if(!v.checked){
      var can=q.k==="n"?v.txt.trim()!=="":v.sel!==null;
      f='<div class="ph-fin"><button class="ph-btn" id="phChk" data-ph="check"'+(can?"":" disabled")+'>Check</button></div>';
    }else{
      foot.className=v.ok?"good":"bad";
      f='<div class="ph-fin"><div class="ph-fbh">'+(v.ok?"✓ Correct":"✕ Not quite")+'</div>'+(v.ok?"":'<p class="ph-fbt"><b>Answer: '+esc(answerText(q))+'</b></p>')+'<p class="ph-fbt">'+esc(q.e)+'</p><button class="ph-btn '+(v.ok?"good":"bad")+'" data-ph="next">Continue</button></div>';
    }
  }
  body.innerHTML=h;
  if(run.leave){foot.className="";foot.innerHTML='<div class="ph-fin"><div class="ph-fbh" style="color:var(--tx)">Leave this lesson?</div><p class="ph-fbt" style="color:var(--tx2)">You will lose the progress made in this lesson.</p><button class="ph-btn" data-ph="stay">Keep going</button><button class="ph-btn ghost" data-ph="leave">Leave</button></div>'}
  else foot.innerHTML=f;
  if(run.phase==="q"&&!run.v.checked&&run.cur.q.k==="n"&&!run.leave){var inp=$("phNum");if(inp)try{inp.focus({preventScroll:true})}catch(e){inp.focus()}}
}
function drawResult(body,foot){
  var r=run.res;
  if(r.fail){
    body.innerHTML='<div class="ph-in ph-result"><div class="ph-burst sad">💔</div><h2>Out of lives</h2><p class="sub">Read the key points again and retry. Mistakes are how it sticks.</p></div>';
    foot.innerHTML='<div class="ph-fin"><button class="ph-btn" data-ph="retry">Try again</button><button class="ph-btn ghost" data-ph="leave">Back to path</button></div>';
  }else{
    body.innerHTML='<div class="ph-in ph-result"><div class="ph-burst">🏆</div><h2>'+(run.node.quiz?"Unit check complete":"Lesson complete")+'</h2><div class="ph-rstats"><div><span>XP earned</span><b>+'+r.xp+'</b></div><div><span>Accuracy</span><b>'+r.acc+'%</b></div></div></div>';
    foot.innerHTML='<div class="ph-fin"><button class="ph-btn good" data-ph="leave">Continue</button></div>';
  }
}
function check(){
  var it=run.cur,q=it.q,v=run.v;if(v.checked)return;
  v.checked=true;v.ok=evaluate(q,v);PS.ans++;
  if(v.ok){PS.ok++;if(it.tries===0)run.first++;run.queue.shift();run.done++}
  else{run.lives--;run.mist++;it.tries++;run.queue.push(run.queue.shift())}
  psave();draw();
}
function next(){
  if(run.lives<=0&&!run.v.ok){run.res={fail:true};draw();return}
  if(!run.queue.length){complete();return}
  prep();draw();
}
function complete(){
  var base=run.node.quiz?20:10,xp=base+run.first*2+(run.mist===0?5:0),acc=Math.round(run.first/run.total*100);
  PS.xp+=xp;
  var t=dayStr(0);if(PS.day.d!==t)PS.day={d:t,xp:0};PS.day.xp+=xp;
  var old=PS.done[run.node.id];PS.done[run.node.id]={a:Math.max(old?old.a:0,acc)};
  try{bumpStreak();save()}catch(e){}
  psave();run.res={xp:xp,acc:acc};draw();
}

/* ---------- events ---------- */
var ov=$("phLesson");
ov.addEventListener("click",function(e){
  var b=e.target.closest("[data-ph]");if(!b||!run)return;
  var a=b.getAttribute("data-ph");
  if(a==="begin"){run.phase="q";prep();draw()}
  else if(a==="pick"){if(run.v&&!run.v.checked){run.v.sel=+b.getAttribute("data-i");draw()}}
  else if(a==="check")check();
  else if(a==="next")next();
  else if(a==="quit"){if(run.res)closeLesson();else{run.leave=true;draw()}}
  else if(a==="stay"){run.leave=false;draw()}
  else if(a==="leave")closeLesson();
  else if(a==="retry")openLesson(run.ui,run.ni);
});
ov.addEventListener("input",function(e){
  if(e.target.id==="phNum"&&run&&run.v){run.v.txt=e.target.value;var c=$("phChk");if(c)c.disabled=run.v.txt.trim()===""}
});
document.addEventListener("keydown",function(e){
  if(!run||ov.hidden)return;
  if(e.key==="Enter"){var btn=document.querySelector("#phFoot .ph-btn:not(.ghost):not(:disabled)");if(btn){e.preventDefault();btn.click()}}
  else if(e.key==="Escape"){if(!run.res){run.leave=!run.leave;draw()}}
  else if(run.phase==="q"&&run.v&&!run.v.checked&&!run.res&&!run.leave&&e.target.id!=="phNum"&&/^[1-4]$/.test(e.key)){
    var bt=document.querySelectorAll(".ph-opt")[+e.key-1];if(bt)bt.click();
  }
});
var sw=$("modeSw");
if(sw)sw.addEventListener("click",function(e){var b=e.target.closest("button[data-m]");if(b)setMode(b.getAttribute("data-m"))});

window.PH={
  get mode(){return mode},
  home:pHome,formulas:pFormulas,me:pMe,
  open:openLesson,reset:reset,bar:bar,setMode:setMode
};
applyMode();
})();

applyTheme();
if(!S.courseStart)S.courseStart=dayStr(0);save();
if(!S.name) enrollView(); else { home(); maybeShowDayAnimation(); }
setTimeout(()=>{try{if(!(window.PH&&PH.mode==="physics"))engine.warm()}catch(e){}},5000);
</script>
<script id="smooth-sequential-progress-v12">
(function(){
  "use strict";
  const KEY="snakebyte_sequential_progress_v12";
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}};
  let state=load();
  if(!state || typeof state!=="object") state={};
  state.completed=Array.isArray(state.completed)?state.completed:[];
  state.completed=[...new Set(state.completed.map(String))];
  state.last=Math.max(0, Number(state.last)||0);

  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  }

  function topics(){
    return [...document.querySelectorAll(
      '[data-topic], [data-topic-id], .topic, .lesson, .chapter, .question-card, .quest-card'
    )];
  }

  function idFor(el,i){
    return String(
      el.getAttribute("data-topic-id") ||
      el.getAttribute("data-topic") ||
      el.id ||
      ("topic-"+i)
    );
  }

  function apply(){
    const ts=topics();
    if(!ts.length) return;
    ts.forEach((el,i)=>{
      const id=idFor(el,i);
      const unlocked = i===0 || state.completed.includes(idFor(ts[i-1],i-1));
      el.classList.toggle("sequential-locked",!unlocked);
      el.classList.toggle("sequential-completed",state.completed.includes(id));
      el.setAttribute("aria-disabled", unlocked?"false":"true");
      if(!unlocked) el.setAttribute("data-sequential-locked","true");
      else el.removeAttribute("data-sequential-locked");
    });
    const done=state.completed.length;
    document.querySelectorAll("[data-progress-count]").forEach(e=>e.textContent=done);
    document.querySelectorAll("[data-progress-total]").forEach(e=>e.textContent=ts.length);
    document.querySelectorAll("[data-progress-percent]").forEach(e=>{
      // Percent is only a visual indicator; completed count itself is unlimited.
      const pct=ts.length?Math.min(100,(done/ts.length)*100):0;
      e.textContent=Math.round(pct);
    });
  }

  window.SnakeByteProgress={
    complete:function(topicId){
      topicId=String(topicId);
      if(!state.completed.includes(topicId)){
        state.completed.push(topicId);
        state.last=state.completed.length;
        save(); apply();
      }
      return state.completed.length;
    },
    isComplete:function(topicId){return state.completed.includes(String(topicId))},
    count:function(){return state.completed.length},
    reset:function(){state={completed:[],last:0};save();apply()},
    refresh:apply
  };

  document.addEventListener("click",function(ev){
    const el=ev.target.closest("[data-topic],[data-topic-id],.topic,.lesson,.chapter,.question-card,.quest-card");
    if(!el) return;
    if(el.getAttribute("data-sequential-locked")==="true"){
      ev.preventDefault(); ev.stopPropagation();
    }
  },true);

  // Smooth Android touch scrolling without blocking vertical gestures.
  
  document.body.style.touchAction="pan-y";
  document.body.style.overflowY="auto";

  apply();
  window.addEventListener("pageshow",apply);
  window.addEventListener("storage",function(){state=load();apply()});
})();
</script>
<style id="smooth-sequential-progress-style-v12">
[data-sequential-locked="true"]{
  pointer-events:none !important;
  opacity:.52 !important;
  filter:saturate(.7) !important;
}
.sequential-completed{
  transition:opacity .25s ease,transform .25s ease,filter .25s ease;
}
</style>
<style id="v14-smooth-ios">
/* ============================================================
   SnakeByte v14 — smooth iOS Liquid Glass
   Rule of thumb: no live blur on scrolling content, nothing
   animates layout, everything moves on the GPU (transform/opacity).
   Only the nav bar + tab bar use backdrop-filter (2 small layers).
   ============================================================ */
:root{
  --spring:cubic-bezier(.32,.72,0,1);
  --pop:cubic-bezier(.34,1.56,.64,1);
  --jelly:cubic-bezier(.3,1.35,.5,1);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --card:rgba(255,255,255,.72);
  --rim:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(20,30,60,.04);
  --lift:0 1px 2px rgba(25,35,60,.06),0 10px 26px -10px rgba(25,40,80,.20);
}
html.dark{
  --card:rgba(30,34,46,.78);
  --rim:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -1px 0 rgba(0,0,0,.35);
  --lift:0 1px 2px rgba(0,0,0,.4),0 12px 28px -10px rgba(0,0,0,.65);
}

/* ---- 1. Remove everything that made scrolling jitter ---- */
html,body{background:var(--bg)!important;background-image:none!important;background-attachment:scroll!important;scroll-behavior:auto!important;perspective:none!important;overscroll-behavior-y:none}
body:before,body:after,#app:before,#app:after,.python-float{display:none!important;animation:none!important;filter:none!important}

  -webkit-backdrop-filter:none;backdrop-filter:none;transform-style:flat}

/* ---- 2. Living background: 3 pre-blurred gradients, GPU drift ---- */

html.scrolling #aurora i,html.scrolling .hero3d *,html.scrolling .hero3d:before,html.scrolling .hero3d:after,html.scrolling .lv.next:after{animation-play-state:paused}

/* ---- 3. Glass surfaces without live blur ---- */
.group,.day-card,.badge,.practice-card,.admin-card,.cert,.msg,.hint{
  background:linear-gradient(160deg,var(--card),var(--card));
  border:1px solid var(--glass-border);box-shadow:var(--rim),var(--lift);border-radius:24px;transition:none}
.day-card:before{filter:none;background:radial-gradient(circle,rgba(10,132,255,.28),transparent 70%);width:240px;height:240px;right:-90px;top:-120px}
.pill{background:var(--card);box-shadow:var(--rim),0 4px 14px -6px rgba(25,40,80,.25);font-variant-numeric:tabular-nums}
textarea,.topic-search,.keys button,.practice-opt,.login input,.admin-login input,.enroll input{
  background:var(--card);box-shadow:var(--rim);transition:box-shadow .25s ease,border-color .25s ease}
textarea:focus,.topic-search:focus,.login input:focus,.admin-login input:focus,.enroll input:focus{box-shadow:var(--rim),0 0 0 4px rgba(10,132,255,.22);border-color:rgba(10,132,255,.55)}
h1{font-weight:800;letter-spacing:-.035em}
.hero3d{box-shadow:0 18px 40px -16px rgba(14,32,58,.45),inset 0 1px rgba(255,255,255,.22);contain:paint}
.hero3d:before{animation:none;background:conic-gradient(from 210deg at 50% 120%,transparent,rgba(115,210,255,.22),transparent 40%,rgba(177,115,255,.20),transparent 80%)}
.hero3d .cube{will-change:transform;animation:cubeFloat 5s ease-in-out infinite;box-shadow:10px 14px 0 rgba(0,0,0,.16),inset 0 2px 2px rgba(255,255,255,.34)}
.hero3d .cube:nth-child(2){animation-delay:-1.7s}.hero3d .cube:nth-child(3){animation-delay:-3.3s}
@keyframes cubeFloat{0%,100%{transform:translate3d(0,0,0) rotate(-3deg)}50%{transform:translate3d(0,-9px,0) rotate(3deg)}}
.hero3d .code-rain{will-change:transform}
.hero3d:after{will-change:transform,opacity}

/* ---- 4. Spring press feedback ---- */
.btn,.lv,.practice-opt,.keys button,#tabbar button{transition:transform .55s var(--pop),opacity .25s ease,background-color .25s ease,box-shadow .3s ease}
.btn:active,.lv:active:not(:disabled),.practice-opt:active,.keys button:active{transform:scale(.95);transition-duration:.1s,.25s,.25s,.3s}
.btn{background:linear-gradient(180deg,#2b9bff,#0a7aff);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 20px -6px rgba(10,122,255,.55);letter-spacing:-.01em}
.btn.alt{background:var(--card);color:var(--tint);box-shadow:var(--rim),var(--lift)}
.btn.running:after{left:0;width:40%;transform:translateX(-120%) skewX(-18deg);animation:shine27 1.1s linear infinite}
@keyframes shine27{to{transform:translateX(320%) skewX(-18deg)}}
.lv{box-shadow:var(--rim),0 4px 10px -4px rgba(25,40,80,.25)}
.lv.next{position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px -4px rgba(10,132,255,.6)}

@keyframes ping27{from{transform:scale(1);opacity:.7}to{transform:scale(1.55);opacity:0}}

/* ---- 5. Progress fill, switch, toast ---- */
.bar i{transform-origin:0 50%;animation:fill27 1s var(--spring) .2s backwards}
@keyframes fill27{from{transform:scaleX(0)}}
.sw i:after{transition:transform .5s var(--pop),width .25s var(--spring);width:27px}

.sw input:checked+i:after{transform:translateX(20px)}
.sw:active input:checked+i:after{transform:translateX(13px)}
#toast{top:calc(var(--sat) + 10px);background:#000;color:#fff;padding:11px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.08);
  transform:translate(-50%,-4px) scale(.5);transform-origin:50% 0;opacity:0;transition:transform .6s var(--pop),opacity .2s ease;will-change:transform,opacity}

/* ---- 6. Screen transitions: compositor-only, staggered ---- */
.enter,#screen.enter{animation:none}
#screen.enter>*{animation:rise27 .6s var(--spring) backwards}
#screen.enter>*:nth-child(2){animation-delay:.04s}#screen.enter>*:nth-child(3){animation-delay:.08s}
#screen.enter>*:nth-child(4){animation-delay:.12s}#screen.enter>*:nth-child(5){animation-delay:.16s}
#screen.enter>*:nth-child(6){animation-delay:.2s}#screen.enter>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise27{from{opacity:0;transform:translate3d(var(--dx,0),var(--dy,14px),0)}}

/* ---- 7. Large title -> compact glass nav bar (iOS) ---- */
#navbar{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(var(--sat) + 46px);padding-top:var(--sat);display:flex;align-items:center;justify-content:center;
  background:rgba(250,251,255,.72);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  border-bottom:.5px solid rgba(60,60,67,.18);opacity:0;visibility:hidden;transform:translate3d(0,-8px,0);pointer-events:none;
  transition:opacity .25s ease,transform .4s var(--spring),visibility 0s .4s}

/* ---- 8. Floating glass tab bar with jelly pill ---- */
#tabbar{left:0;right:0;margin-inline:auto;transform:none;width:min(620px,calc(100% - 28px));bottom:calc(var(--sab) + 10px);padding:6px;border-radius:30px;
  background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(20px) saturate(190%);backdrop-filter:blur(20px) saturate(190%);
